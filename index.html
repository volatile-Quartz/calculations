<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 草稿纸查看器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #171923;
    --card: #1e2030;
    --border: #2a2d40;
    --text: #e6e7ef;
    --text-dim: #8a8e9f;
    --accent: #4f8cff;
    --accent-hover: #6fa2ff;
    --green: #34d399;
    --red: #f87171;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* 顶部通知条 */
  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #0f1115; font-weight: 600;
    padding: 12px 28px; border-radius: 50px; z-index: 999;
    box-shadow: 0 8px 30px rgba(52,211,153,0.3);
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
    max-width: 80vw;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--red); color: white; }
  .thumb.error::after {
    content: '⚠ 加载失败，点按重试';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--red); font-size: 12px;
    background: rgba(15,17,21,.72);
  }

  /* 主容器 */
  .app {
    max-width: 1400px; margin: 0 auto; padding: 40px 24px 80px;
  }
  h1 {
    margin: 0 0 6px; font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #4f8cff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--text-dim); margin-bottom: 32px; font-size: 14px; }

  /* 控制面板 */
  .control {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
  .ctrl-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  select, input[type=number], input[type=text] {
    background: var(--bg-soft); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; font-family: inherit;
    min-width: 180px; outline: none; transition: border 0.15s;
  }
  select:focus, input:focus { border-color: var(--accent); }
  #jump-input { width: 190px; min-width: 0; }

  .btn {
    background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    font-family: inherit;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--bg-soft); border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }

  /* 下载进度条 */
  #progress-wrap {
    background: var(--bg-soft); border-radius: 8px; padding: 10px 14px;
    display: none; align-items: center; gap: 12px; flex: 1; min-width: 280px;
  }
  #progress-wrap.show { display: flex; }
  #progress-bar {
    flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  #progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.15s; }
  #progress-text { font-size: 13px; color: var(--text-dim); white-space: nowrap; }

  /* 虚拟滚动图片网格：容器只负责撑高滚动条，瓦片绝对定位 */
  #grid { position: relative; }
  .thumb {
    position: absolute; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; cursor: zoom-in;
    transition: transform 0.15s, border-color 0.15s;
  }
  .thumb:hover { transform: translateY(-2px); border-color: var(--accent); }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.2s;
    display: block; user-select: none; -webkit-user-drag: none;
  }
  .thumb.loaded img { opacity: 1; }
  .thumb .num {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(0,0,0,0.6); color: white; font-size: 12px; font-weight: 600;
    padding: 3px 8px; border-radius: 5px; backdrop-filter: blur(4px);
  }

  /* 图片网格信息栏 */
  #grid-info {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text-dim); font-size: 13px; margin-bottom: 12px;
  }
  #grid-info strong { color: var(--text); }

  /* 放大层 */
  #lightbox {
    position: fixed; inset: 0; background: rgba(8, 10, 16, 0.95);
    backdrop-filter: blur(8px); z-index: 100;
    display: none; align-items: center; justify-content: center;
  }
  #lightbox.show { display: flex; }

  /* 图片舞台：只负责图片层，不拦截鼠标事件（点击穿透到 lightbox 背景） */
  #lb-stage {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    pointer-events: none;
  }
  .lb-slide-img {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    will-change: transform;
    pointer-events: none;
  }
  .lb-slide-img img {
    max-width: 90vw; max-height: 85vh;
    transform-origin: center center;
    transition: transform 0.15s ease;
    cursor: zoom-in; user-select: none; -webkit-user-drag: none;
    object-fit: contain;
    pointer-events: auto;   /* 只有图片本身可交互 */
  }

  /* 所有悬浮控件层级高于图片层，保证不被盖住 */
  .lb-close, .lb-nav, .lb-hint { z-index: 30; }
  .lb-close {
    position: absolute; top: 24px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.1); color: white; border: none;
    font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .lb-close:hover { background: rgba(255,255,255,0.2); }

  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(255,255,255,0.08); color: white; border: none;
    font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .lb-nav:hover { background: rgba(255,255,255,0.2); }
  .lb-prev { left: 24px; }
  .lb-next { right: 24px; }

  .lb-toolbar {
    z-index: 31;
    position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; background: rgba(0,0,0,0.5);
    padding: 8px 14px; border-radius: 50px; backdrop-filter: blur(10px);
  }
  .lb-toolbar button {
    background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%; width: 40px; height: 40px; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .lb-toolbar button:hover { background: rgba(255,255,255,0.15); }
  .lb-toolbar .info {
    color: white; font-size: 12px; padding: 0 12px; align-self: center;
    white-space: nowrap;
  }

  .lb-hint {
    position: absolute; top: 24px; left: 24px;
    color: rgba(255,255,255,0.5); font-size: 12px; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="app">
  <h1>📐 草稿纸查看器</h1>
  <div class="subtitle" id="subtitle">按编号段 / 月份选择 · 按需下载 · 高清查看</div>

  <!-- 控制面板 -->
  <div class="control">
    <div class="ctrl-group">
      <div class="ctrl-label">编号段（千 → 百）</div>
      <div style="display:flex;gap:8px;">
        <select id="zip-k-select" title="先按千位分组"></select>
        <select id="zip-select" title="再选百位分卷"></select>
      </div>
    </div>
    <button id="dl-btn" class="btn">📥 下载并查看</button>
    <div class="ctrl-group">
      <div class="ctrl-label">按月份查看（年 → 月）</div>
      <div style="display:flex;gap:8px;">
        <select id="year-select" title="先选年份"></select>
        <select id="month-select" title="再选月份"></select>
        <button id="month-btn" class="btn btn-secondary" title="列出该月内所有图片（跨包自动串联）">查看</button>
      </div>
    </div>
    <div id="progress-wrap">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-text">0 / 0</div>
    </div>
    <div class="ctrl-group" style="margin-left:auto;">
      <div class="ctrl-label">编号定位 / 范围浏览</div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="jump-input" inputmode="numeric" placeholder="如 7800 或 7600-7700">
        <button id="jump-btn" class="btn btn-secondary" title="直达该编号的图片">跳转</button>
        <button id="range-btn" class="btn btn-secondary" title="列出编号段内所有图片（跨包自动串联）">范围浏览</button>
      </div>
    </div>
  </div>

  <!-- 网格信息 -->
  <div id="grid-info" style="display:none;">
    <div>共 <strong id="grid-count">0</strong> 张 · <span id="grid-range"></span></div>
    <div style="color: var(--text-dim);">键盘 ← → 翻页 · ESC 退出 · 滚轮缩放</div>
  </div>

  <!-- 虚拟滚动缩略图网格 -->
  <div id="grid"></div>

  <!-- 分批加载状态 -->
  <div id="grid-more" style="display:none; text-align:center; color:var(--text-dim); padding:6px 0 30px; font-size:13px;"></div>
</div>

<!-- 通知条 -->
<div id="toast"></div>

<!-- 放大层 -->
<div id="lightbox">
  <button class="lb-close" onclick="closeLightbox()" title="关闭 (ESC)">✕</button>
  <button class="lb-nav lb-prev" onclick="lbPrev()" title="上一张 (←)">‹</button>
  <button class="lb-nav lb-next" onclick="lbNext()" title="下一张 (→)">›</button>
  <div class="lb-hint">← → 翻页 · ESC 关闭 · 滚轮缩放 · 拖动平移 · L/R 旋转</div>
  <div class="lb-toolbar">
    <button onclick="lbZoom(-0.15)" title="缩小">−</button>
    <button onclick="lbZoom(0.15)" title="放大">+</button>
    <button onclick="lbZoomReset()" title="重置缩放">⟲</button>
    <button onclick="lbRotate(-90)" title="向左旋转">↺</button>
    <button onclick="lbRotate(90)" title="向右旋转">↻</button>
    <span class="info" id="lb-info"></span>
  </div>
  <div id="lb-stage">
    <div id="lb-current" class="lb-slide-img"><img id="lb-img" src="" alt=""></div>
    <div id="lb-next" class="lb-slide-img" style="display:none"><img id="lb-img2" src="" alt=""></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
// ===== 配置 =====
const WORKER_URL = 'https://calculations-viewer.502487460.workers.dev';
const MAX_CACHE = 3;          // 内存里最多保留几个「已解压」的包（LRU）
const TILE_MIN = 180;         // 缩略图最小宽度（与旧版网格一致）
const GAP = 14;               // 瓦片间距
const OVERSCAN_ROWS = 2;      // 视口外多渲染几行，滚动更顺滑
const p3 = (n) => String(n).padStart(3, '0');   // 编号显示：不足 3 位补零（No.007 / No.233 / No.1754）
let REMOTE_OK = false;        // Worker 支持按需读取（HTTP Range）时为 true

// ===== 全局状态 =====
let INDEX = null;
let CALENDAR = [];            // 月份 → 编号区间（calendar.json）
let CURRENT_LIST = [];        // 当前网格/放大层展示的图片：{num, name, url, zipName}
let CURRENT_ZIP = null;       // 下拉框对应的包（仅用于展示）
let LB_IDX = 0;               // 放大层当前索引
let LB_SCALE = 1;
let LB_ROTATE = 0;
let LB_IMAGES = [];           // 与 CURRENT_LIST 同步（放大层直接读它）

const ZIP_CACHE = new Map();  // zip_name -> {files, numMap, urls}，最近使用的在 Map 末尾
const ZIP_INFLIGHT = new Map(); // 正在下载中的包，避免重复请求
let PROTECTED = new Set();    // 正在批量加载的包（防止被 LRU 淘汰）
let BUSY = false;             // 加载互斥
let LOAD = null;              // 进度聚合状态
let INC = null;               // 分批加载会话（大范围浏览）
let INC_GEN = 0;              // 会话代次：切换目标时作废旧批次

// ===== 通知条 =====
let toastTimer = null;
function toast(msg, isError = false, duration = 5000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('error', isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  if (duration > 0) {
    toastTimer = setTimeout(() => el.classList.remove('show'), duration);
  }
}

// ===== 加载索引 =====
async function loadIndex() {
  try {
    const [idxResp, calResp] = await Promise.all([
      fetch('index.json'),
      fetch('calendar.json').catch(() => null),
    ]);
    INDEX = await idxResp.json();
    // 编号显示统一补零（sync 生成的 label 形如 No.0–99）
    (INDEX.zips || []).forEach(z => {
      if (z.label) z.label = z.label.replace(/No\.(\d+)([–-])(\d+)/, (_, a, sep, b) => `No.${p3(+a)}${sep}${p3(+b)}`);
    });
    if (calResp && calResp.ok) {
      try { CALENDAR = (await calResp.json()).months || []; } catch (e) { CALENDAR = []; }
    }
    populateZips();
    populateMonths();
    probeRemote();                       // 探测 Worker 是否支持按需读取（异步，不阻塞）
  } catch (e) {
    toast('加载索引失败: ' + e.message, true, 0);
  }
}

function thousandOf(z) {
  return z.range ? Math.floor(z.range[0] / 1000) : null;
}

function zipOptionText(z) {
  const rng = z.range ? `No.${p3(z.range[0])}–${p3(z.range[1])}` : '编号未知';
  let prefix = z.label || '';
  if (prefix === rng) prefix = '';        // label 与 rng 相同时不重复展示
  // 编号分卷命名（如 sp_000-099）不解析年月；仅旧月份命名的包显示年月
  const isNumbered = /\d{3,6}\s*-\s*\d{3,6}/.test(z.zip_name);
  const mm = isNumbered ? null : z.zip_name.match(/(20\d{2})[-_.]?(0[1-9]|1[0-2])/);
  if (mm) prefix = `${mm[1]}-${mm[2]}`;
  const cnt = (z.count != null) ? `${z.count} 张` : '张数未知';
  return { value: z.zip_name, text: [prefix, rng, cnt, `${z.size_mb}MB`].filter(Boolean).join(' · ') };
}

function populateZips() {
  const kSel = document.getElementById('zip-k-select');
  if (!INDEX.zips || !INDEX.zips.length) {
    toast('索引里还没有归档包：发布 Release 后运行 Sync Index 工作流', true, 0);
    return;
  }

  // 第一级：按千位分组（倒序，最新在前），如 No.000–999 / No.1000–1999
  const groups = new Map();
  for (const z of INDEX.zips) {
    const k = thousandOf(z);
    if (k == null) continue;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(z);
  }
  kSel.innerHTML = '';
  for (const k of [...groups.keys()].sort((a, b) => b - a)) {
    const list = groups.get(k);
    const cnt = list.reduce((s, z) => s + (z.count || 0), 0);
    const opt = document.createElement('option');
    opt.value = String(k);
    opt.textContent = `No.${p3(k * 1000)}–${p3(k * 1000 + 999)}（${list.length} 卷 · ${cnt} 张）`;
    kSel.appendChild(opt);
  }
  kSel.onchange = populateHundredOptions;
  populateHundredOptions();

  // 副标题：全库编号范围
  const sub = document.getElementById('subtitle');
  if (INDEX.range_min != null) {
    sub.textContent = `按编号段 / 月份选择 · 按需下载 · 高清查看 · No.${p3(INDEX.range_min)} - No.${p3(INDEX.range_max)} · 共 ${INDEX.total_count ?? '?'} 张`;
  }

  // 输入框提示
  const ji = document.getElementById('jump-input');
  if (INDEX.range_min != null && INDEX.range_max != null) {
    const mid = Math.round((INDEX.range_min + INDEX.range_max) / 2);
    ji.placeholder = `如 ${p3(mid)} 或 ${p3(mid)}-${p3(mid + 100)}`;
  }
}

// 第二级：当前千位段内的百级分卷（倒序）
function populateHundredOptions() {
  const kSel = document.getElementById('zip-k-select');
  const sel = document.getElementById('zip-select');
  const k = parseInt(kSel.value, 10);
  const inK = INDEX.zips
    .filter(z => thousandOf(z) === k)
    .sort((a, b) => (b.range?.[0] ?? -1) - (a.range?.[0] ?? -1));
  sel.innerHTML = '';
  for (const z of inK) {
    const o = zipOptionText(z);
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = o.text;
    sel.appendChild(opt);
  }
  CURRENT_ZIP = inK[0] || null;
}

// 跳转 / 范围 / 月份等流程程序化设定 zip-select 后，同步第一级千位选择
function syncZipCascade() {
  const sel = document.getElementById('zip-select');
  const z = INDEX.zips.find(x => x.zip_name === sel.value);
  if (!z) return;
  const kSel = document.getElementById('zip-k-select');
  const k = thousandOf(z);
  if (k == null) return;
  if (kSel.value !== String(k)) {
    kSel.value = String(k);
    populateHundredOptions();
  }
  sel.value = z.zip_name;
}

// ===== 月份查看（年 → 月两级联动）=====
// 年级分组：label 无年份前缀的（高中時代 / 初期發展階段…）归入「早期」
function populateMonths() {
  const ySel = document.getElementById('year-select');
  const mSel = document.getElementById('month-select');
  if (!ySel || !mSel || !CALENDAR.length) return;

  const groups = [];
  const map = new Map();
  for (const m of CALENDAR) {
    const ym = String(m.label || '').match(/^(\d{4})/);
    const key = ym ? ym[1] : '早期';
    if (!map.has(key)) { const g = { key, months: [] }; map.set(key, g); groups.push(g); }
    map.get(key).months.push(m);
  }
  ySel.innerHTML = '';
  for (const g of groups) {
    const cnt = g.months.reduce((s, m) => s + (m.ranges || []).reduce((a, r) => a + Math.max(0, r[1] - r[0] + 1), 0), 0);
    const opt = document.createElement('option');
    opt.value = g.key;
    opt.textContent = g.key === '早期' ? `早期（${cnt} 张）` : `${g.key} 年（${cnt} 张）`;
    ySel.appendChild(opt);
  }
  ySel.onchange = populateMonthOptions;
  if (ySel.options.length) ySel.selectedIndex = ySel.options.length - 1;   // 默认最近年份
  populateMonthOptions();
}

// 第二级：当前年份（或早期）下的月份 / 时段
function populateMonthOptions() {
  const ySel = document.getElementById('year-select');
  const mSel = document.getElementById('month-select');
  const key = ySel.value;
  const months = CALENDAR.filter(m => key === '早期'
    ? !/^\d{4}/.test(String(m.label || ''))
    : String(m.label || '').startsWith(key));
  mSel.innerHTML = '';
  for (const m of months) {
    const cnt = (m.ranges || []).reduce((s, r) => s + Math.max(0, r[1] - r[0] + 1), 0);
    const opt = document.createElement('option');
    opt.value = m.label;
    opt.textContent = cnt > 0 ? `${m.label} · ${cnt} 张` : `${m.label}（无）`;
    if (m.note) opt.title = m.note;
    mSel.appendChild(opt);
  }
  if (mSel.options.length) mSel.selectedIndex = mSel.options.length - 1;  // 默认最近月份
}

// 按月份查看：月份 → 编号区间（可多段）→ 串联覆盖的包 → 过滤显示
async function viewMonth() {
  if (!INDEX) return;
  const label = document.getElementById('month-select').value;
  const m = CALENDAR.find(x => x.label === label);
  if (!m) return;
  const ranges = (m.ranges || []).filter(r => r[1] >= r[0]);
  if (!ranges.length) return toast(`${label} 这段时间没有草稿`, true);

  const covering = INDEX.zips.filter(z => z.range &&
    ranges.some(r => z.range[1] >= r[0] && z.range[0] <= r[1]));
  if (!covering.length) return toast(`${label} 的编号段尚未收录`, true);

  const estMB = covering.reduce((s, z) => s + (z.size_mb || 0), 0);
  if (!REMOTE_OK && estMB > 900 && !window.confirm(
    `${label} 需要下载 ${covering.length} 个包，合计约 ${Math.round(estMB)} MB。继续？`
  )) return;

  document.getElementById('zip-select').value = covering[0].zip_name;
  syncZipCascade();
  CURRENT_ZIP = covering[0];
  await loadSelection(covering, ranges, label);
}

// ===== 下载 + 解压（带 LRU 缓存） =====
function getZipUrl(zipInfo) {
  if (WORKER_URL) {
    return `${WORKER_URL}/zip/${INDEX.repo}/${zipInfo.asset_id}`;
  }
  return zipInfo.browser_url || '';
}

function extractNum(filename) {
  const m = filename.match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

function showProgress() { document.getElementById('progress-wrap').classList.add('show'); }
function hideProgress() { document.getElementById('progress-wrap').classList.remove('show'); }
function mb(bytes) { return (bytes / 1048576).toFixed(1) + ' MB'; }

function updateProgress() {
  if (!LOAD) return;
  const fill = document.getElementById('progress-fill');
  const txt = document.getElementById('progress-text');
  const cur = LOAD.stage === '下载'
    ? Math.min(LOAD.cur, LOAD.zipBytes || LOAD.cur)
    : (LOAD.zipBytes || 0);
  const done = LOAD.doneBytes + cur;
  fill.style.width = Math.min(100, done / LOAD.totalBytes * 100).toFixed(1) + '%';
  const prefix = LOAD.count > 1 ? `[${LOAD.idx}/${LOAD.count}] ` : '';
  if (LOAD.stage === '下载') {
    txt.textContent = `${prefix}下载 ${mb(LOAD.cur)} / ${mb(LOAD.curTotal)}`;
  } else {
    txt.textContent = `${prefix}解压 ${LOAD.cur}/${LOAD.curTotal}`;
  }
}

function setControlsDisabled(d) {
  for (const id of ['dl-btn', 'jump-btn', 'range-btn', 'month-btn']) {
    const el = document.getElementById(id);
    if (el) el.disabled = d;
  }
}

// 下载并解压单个 zip；返回 {files, numMap, urls}
async function loadZip(z) {
  const url = getZipUrl(z);
  if (!url) throw new Error('缺少下载地址');

  let resp;
  try {
    resp = await fetch(url);
  } catch (e) {
    throw new Error(`无法连接下载源${WORKER_URL ? '（Worker 代理）' : ''}：${e.message}`);
  }
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const len = parseInt(resp.headers.get('content-length') || '0', 10);
  if (len) LOAD.curTotal = len;

  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); received += value.length;
    LOAD.stage = '下载'; LOAD.cur = received;
    updateProgress();
  }

  LOAD.stage = '解压'; LOAD.cur = 0; LOAD.curTotal = 1;
  updateProgress();

  const jszip = await JSZip.loadAsync(new Blob(chunks));
  const names = Object.keys(jszip.files).filter(
    n => !n.endsWith('/') && /\.(jpe?g|png|gif|webp|bmp)$/i.test(n)
  );
  LOAD.curTotal = names.length || 1;

  const files = [];
  const urls = [];
  const numMap = new Map();
  for (let i = 0; i < names.length; i++) {
    const b = await jszip.files[names[i]].async('blob');
    const u = URL.createObjectURL(b);
    urls.push(u);
    const name = names[i].split('/').pop();
    const num = extractNum(name);
    const item = { num, name, url: u, zipName: z.zip_name };
    files.push(item);
    if (num > 0 && !numMap.has(num)) numMap.set(num, item);
    LOAD.cur = i + 1;
    if (i % 5 === 0 || i === names.length - 1) updateProgress();
  }
  files.sort((a, b) => a.num - b.num);
  return { files, numMap, urls };
}

// 取包（优先缓存）；加载新包后按 LRU 回收旧包
async function ensureZip(z) {
  const name = z.zip_name;
  if (ZIP_CACHE.has(name)) {                 // 命中：移到 Map 末尾表示最近使用
    const e = ZIP_CACHE.get(name);
    ZIP_CACHE.delete(name); ZIP_CACHE.set(name, e);
    return e;
  }
  if (ZIP_INFLIGHT.has(name)) return ZIP_INFLIGHT.get(name);

  const p = loadZip(z).finally(() => ZIP_INFLIGHT.delete(name));
  ZIP_INFLIGHT.set(name, p);
  const entry = await p;
  ZIP_CACHE.set(name, entry);
  evictCache();
  return entry;
}

function evictCache() {
  const keep = new Set(PROTECTED);
  for (const f of CURRENT_LIST) keep.add(f.zipName);   // 正在展示的包不动
  while (ZIP_CACHE.size > MAX_CACHE) {
    let victim = null;
    for (const k of ZIP_CACHE.keys()) {
      if (!keep.has(k)) { victim = k; break; }
    }
    if (!victim) break;
    for (const u of ZIP_CACHE.get(victim).urls) URL.revokeObjectURL(u);
    ZIP_CACHE.delete(victim);
  }
}

// ===== 远程 zip 按需读取（HTTP Range） =====
// 原理：zip 的「中央目录」只有几 KB，先经 Worker 读它建立条目表，
// 之后看哪张图就 Range 取那张图的字节（DEFLATE 用浏览器自带解压），不再整包下载。
const RZ_DIRS = new Map();      // asset_id -> Promise<entries[]>（目录缓存，每包只取一次）
const BLOB_LRU = new Map();     // file对象 -> {url, bytes}，最近使用在末尾
let BLOB_BYTES = 0;
const BLOB_MAX_BYTES = 600 * 1048576;
const BLOB_MAX_COUNT = 500;

function rangeUrl(z, bytes) {
  // 区间放 query 而非 Range 头：普通 GET 请求，不触发 CORS 预检
  return `${WORKER_URL}/range/${INDEX.repo}/${z.asset_id}${bytes ? `?bytes=${bytes}` : ''}`;
}

async function fetchRange(z, start, end) {
  const r = await fetch(rangeUrl(z, `${start}-${end}`));
  if (r.status !== 206) throw new Error('远端不支持按需读取(HTTP ' + r.status + ')');
  return new Uint8Array(await r.arrayBuffer());
}

async function remoteSize(z) {
  const r = await fetch(rangeUrl(z, '0-0'));
  const cr = r.headers.get('Content-Range');
  if (r.status === 206 && cr && cr.includes('/')) return parseInt(cr.split('/').pop(), 10);
  throw new Error('无法获取包大小');
}

function findSig(u8, sig) {           // 在 Uint8Array 里从后往前找 4 字节签名
  const s = sig;
  outer: for (let i = u8.length - 4; i >= 0; i--) {
    for (let j = 0; j < 4; j++) if (u8[i + j] !== s[j]) continue outer;
    return i;
  }
  return -1;
}

function parseCD(cd, z) {             // 解析中央目录 → 图片条目列表
  const isImg = /\.(jpe?g|png|gif|webp|bmp)$/i;
  const out = [];
  let p = 0;
  while (p + 46 <= cd.length && cd[p] === 0x50 && cd[p + 1] === 0x4B && cd[p + 2] === 0x01 && cd[p + 3] === 0x02) {
    const dv = new DataView(cd.buffer, cd.byteOffset + p);
    const method = dv.getUint16(10, true);
    const csize = dv.getUint32(20, true);
    const usize = dv.getUint32(24, true);
    const nl = dv.getUint16(28, true);
    const el = dv.getUint16(30, true);
    const cl = dv.getUint16(32, true);
    const off = dv.getUint32(42, true);
    const name = new TextDecoder().decode(cd.subarray(p + 46, p + 46 + nl));
    const base = name.split('/').pop();
    if (!name.endsWith('/') && isImg.test(base) && !name.includes('__MACOSX') && !base.startsWith('.')) {
      out.push({ name, num: extractNum(base), off, csize, usize, method, zip: z });
    }
    p += 46 + nl + el + cl;
  }
  return out;
}

function remoteDir(z) {
  let p = RZ_DIRS.get(z.asset_id);
  if (!p) {
    p = (async () => {
      const size = await remoteSize(z);
      let tail = await fetchRange(z, Math.max(0, size - 2048), size - 1);
      let i = findSig(tail, [0x50, 0x4B, 0x05, 0x06]);            // EOCD
      if (i < 0) {
        tail = await fetchRange(z, Math.max(0, size - 65557), size - 1);
        i = findSig(tail, [0x50, 0x4B, 0x05, 0x06]);
      }
      if (i < 0) throw new Error('zip 目录定位失败');
      const dv = new DataView(tail.buffer, tail.byteOffset + i);
      const total = dv.getUint16(10, true);
      const cdSize = dv.getUint32(12, true), cdOff = dv.getUint32(16, true);
      if (cdOff === 0xFFFFFFFF || cdSize === 0xFFFFFFFF || total === 0xFFFF) throw new Error('zip64 暂不支持');
      const cd = await fetchRange(z, cdOff, cdOff + cdSize - 1);
      return parseCD(cd, z);
    })().catch(e => { RZ_DIRS.delete(z.asset_id); throw e; });
    RZ_DIRS.set(z.asset_id, p);
  }
  return p;
}

async function inflateRaw(bytes) {
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function rememberBlob(f, url, bytes) {
  f.url = url;
  BLOB_LRU.delete(f); BLOB_LRU.set(f, { url, bytes });
  BLOB_BYTES += bytes;
  while ((BLOB_LRU.size > BLOB_MAX_COUNT || BLOB_BYTES > BLOB_MAX_BYTES) && BLOB_LRU.size > 1) {
    const [oldF, info] = BLOB_LRU.entries().next().value;
    URL.revokeObjectURL(info.url);
    BLOB_BYTES -= info.bytes;
    oldF.url = null; oldF.promise = null;
    BLOB_LRU.delete(oldF);
  }
}

async function fetchRemoteImage(f) {
  const entries = await remoteDir(f.zip);
  const e = entries.find(x => x.name === f.name);
  if (!e) throw new Error('包内找不到 ' + f.name);
  const header = await fetchRange(f.zip, e.off, e.off + 29);
  const hd = new DataView(header.buffer, header.byteOffset);
  if (hd.getUint32(0, true) !== 0x04034b50) throw new Error('本地头校验失败');
  const nl = hd.getUint16(26, true), el = hd.getUint16(28, true);
  const start = e.off + 30 + nl + el;
  const bytes = await fetchRange(f.zip, start, start + e.csize - 1);
  const data = e.method === 8 ? await inflateRaw(bytes) : bytes;
  const url = URL.createObjectURL(new Blob([data]));
  rememberBlob(f, url, data.byteLength);
  return url;
}

// 取图片 URL（懒加载统一入口；整包模式已有 url 则直接返回）
function fileUrl(f) {
  if (f.url) {
    const e = BLOB_LRU.get(f);
    if (e) { BLOB_LRU.delete(f); BLOB_LRU.set(f, e); }   // 触碰 LRU
    return Promise.resolve(f.url);
  }
  if (!f.promise) {
    f.promise = fetchRemoteImage(f).catch(err => { f.promise = null; throw err; });
  }
  return f.promise;
}

async function probeRemote() {
  if (!WORKER_URL || !INDEX || !INDEX.zips || !INDEX.zips.length) return;
  const z = INDEX.zips.find(x => x.asset_id);
  if (!z) return;
  try {
    const r = await fetch(rangeUrl(z, '0-15'));
    if (r.status === 206) {
      const buf = new Uint8Array(await r.arrayBuffer());
      if (buf[0] === 0x50 && buf[1] === 0x4B) REMOTE_OK = true;   // PK = 合法 zip 头
    }
  } catch (e) { /* 按需读取不可用，保持整包模式 */ }
  updateDlLabel();
  if (REMOTE_OK) toast('✅ 已启用按需加载：查看某张图只下载那张', false);
}

function updateDlLabel() {
  const b = document.getElementById('dl-btn');
  if (b) b.textContent = REMOTE_OK ? '👁️ 查看（按需加载）' : '📥 下载并查看';
}

// 下载一组包（带进度条，串行），返回合并后的文件列表
async function downloadZips(zips) {
  LOAD = {
    idx: 0, count: zips.length, stage: '下载',
    cur: 0, curTotal: 0, zipBytes: 0, doneBytes: 0,
    totalBytes: Math.max(1, zips.reduce((s, z) => s + (z.size_mb || 0) * 1048576, 0)),
  };
  showProgress();
  const out = [];
  for (const z of zips) {
    LOAD.idx++;
    LOAD.stage = '下载'; LOAD.cur = 0;
    LOAD.zipBytes = (z.size_mb || 0) * 1048576;
    LOAD.curTotal = LOAD.zipBytes;
    updateProgress();
    const entry = await ensureZip(z);
    LOAD.doneBytes += LOAD.zipBytes;
    updateProgress();
    out.push(...entry.files);
  }
  return out;
}

// 按需读取：只取各包目录（约 10KB/包）建立条目表，图片浏览到才取
async function tryLoadRemote(zips, filter, label, notify) {
  BUSY = true;
  setControlsDisabled(true);
  try {
    const list = [];
    for (const z of zips) {
      const entries = await remoteDir(z);
      for (const e of entries) {
        list.push({ num: e.num, name: e.name, zipName: z.zip_name, zip: z, url: null, promise: null });
      }
    }
    list.sort((a, b) => a.num - b.num);
    const filtered = filter ? list.filter(f => filter.some(r => f.num >= r[0] && f.num <= r[1])) : list;
    if (!filtered.length) { toast('该范围内没有图片', true); return filtered; }
    renderGrid(filtered);
    if (notify) toast(`✅ 已就绪 ${filtered.length} 张 · 按需加载（浏览到哪张取哪张）`);
    return filtered;
  } catch (e) {
    // 结构性错误（zip64 / 目录损坏）才永久关闭按需；网络抖动保留，下次再试
    if (/zip64|目录定位失败/.test(e.message)) {
      REMOTE_OK = false;
      updateDlLabel();
    }
    toast('按需读取不可用（' + e.message + '），本次改用整包下载', true);
    return null;
  } finally {
    BUSY = false;
    setControlsDisabled(false);
  }
}

// 加载一组包：优先按需读取（远程解 zip 单图）；不可用时回退整包下载
async function loadSelection(zips, filter, label, notify = true) {
  if (BUSY) { toast('正在加载中，请稍候…', true); return null; }
  cancelIncremental();                       // 任何新选择都作废旧的分批会话
  if (REMOTE_OK) {
    const r = await tryLoadRemote(zips, filter, label, notify);
    if (r !== null) return r;                // null = 按需读取失败，走整包回退
  }
  if (zips.length >= 2) return startIncremental(zips, filter, label, notify);

  BUSY = true;
  setControlsDisabled(true);
  PROTECTED = new Set(zips.map(z => z.zip_name));
  try {
    const all = await downloadZips(zips);
    all.sort((a, b) => a.num - b.num);

    let list = all;
    if (filter) list = all.filter(f => filter.some(r => f.num >= r[0] && f.num <= r[1]));
    if (!list.length) { toast('该范围内没有图片', true); return null; }

    renderGrid(list);
    if (notify) toast(`✅ 已加载 ${list.length} 张（${label}）`);
    return list;
  } catch (e) {
    toast('加载失败: ' + e.message, true);
    return null;
  } finally {
    BUSY = false;
    setControlsDisabled(false);
    hideProgress();
    PROTECTED = new Set();
    LOAD = null;
  }
}

// ===== 分批加载（大范围浏览）=====
// 跨多卷时：先加载首批立刻显示，页面滚动接近底部时自动加载下一批
const INC_BATCH = 1;           // 每批加载的包数
const INC_TRIGGER_PX = 1200;   // 距页面底部多少像素内触发下一批

function cancelIncremental() {
  INC_GEN++;
  INC = null;
  const el = document.getElementById('grid-more');
  if (el) el.style.display = 'none';
}

function setMoreText(text) {
  const el = document.getElementById('grid-more');
  if (el) { el.style.display = 'block'; el.textContent = text; }
}

function updateMore(state) {
  if (state.error) return setMoreText(`— 加载中断（已完成 ${state.list.length} 张）—`);
  if (state.done) return setMoreText(`— 已全部加载（共 ${state.list.length} 张）—`);
  setMoreText(`已加载 ${state.list.length} 张 · 还剩 ${state.zips.length - state.idx} 卷 — 继续下滑自动加载`);
}

async function startIncremental(zips, filter, label, notify) {
  cancelIncremental();
  const state = { gen: ++INC_GEN, zips, filter, label, notify, idx: 0, all: [], list: [], done: false, busy: false, error: false, rendered: false };
  INC = state;
  PROTECTED = new Set(zips.map(z => z.zip_name));
  await loadNextBatch();
  return state.list;
}

async function loadNextBatch() {
  const state = INC;
  if (!state || state.done || state.busy) return;
  state.busy = true;
  BUSY = true;
  setControlsDisabled(true);
  if (state.idx > 0) setMoreText('正在加载更多…');

  const slice = state.zips.slice(state.idx, state.idx + INC_BATCH);
  try {
    const files = await downloadZips(slice);
    state.idx += slice.length;
    state.all.push(...files);
    state.all.sort((a, b) => a.num - b.num);
    state.list = state.filter
      ? state.all.filter(f => state.filter.some(r => f.num >= r[0] && f.num <= r[1]))
      : state.all;
    if (state.gen !== INC_GEN) return;               // 会话已被切走，放弃渲染
    state.done = state.idx >= state.zips.length;

    if (state.list.length) {
      renderGrid(state.list, state.rendered);        // 首批清空重建，后续追加不闪
      state.rendered = true;
    }
    if (state.done) {
      if (!state.list.length) toast('该范围内没有图片', true);
      else if (state.notify) toast(`✅ 已全部加载 ${state.list.length} 张（${state.label}）`);
    }
    updateMore(state);
  } catch (e) {
    state.error = true;                              // 出错即停，避免自动重试死循环
    state.done = true;
    if (state.gen === INC_GEN) {
      toast('加载失败: ' + e.message + '（已加载部分保留）', true);
      updateMore(state);
    }
  } finally {
    state.busy = false;
    if (state.gen === INC_GEN) {
      BUSY = false;
      setControlsDisabled(false);
      hideProgress();
      LOAD = null;
    }
  }
  checkAndLoadMore();                                // 若仍在底部，继续加载
}

// 滚动接近底部（或首屏未占满）时加载下一批
function checkAndLoadMore() {
  const state = INC;
  if (!state || state.done || state.busy || BUSY) return;
  if (window.scrollY + window.innerHeight >= document.body.offsetHeight - INC_TRIGGER_PX) loadNextBatch();
}

// ===== 虚拟滚动网格 =====
const VG = { cols: 1, tileW: 0, tileH: 0, gridTop: 0, live: new Map(), pool: [] };
let gridScrollScheduled = false;

function computeLayout() {
  const grid = document.getElementById('grid');
  const w = grid.clientWidth;
  VG.cols = Math.max(1, Math.floor((w + GAP) / (TILE_MIN + GAP)));
  VG.tileW = (w - (VG.cols - 1) * GAP) / VG.cols;
  VG.tileH = VG.tileW * 4 / 3;
  VG.gridTop = grid.getBoundingClientRect().top + window.scrollY;
}

function makeTile() {
  const el = document.createElement('div');
  el.className = 'thumb';
  const img = document.createElement('img');
  img.draggable = false; img.alt = '';
  const num = document.createElement('div');
  num.className = 'num';
  el.append(img, num);
  return el;
}

function fillTile(el, idx) {
  const item = CURRENT_LIST[idx];
  const row = Math.floor(idx / VG.cols);
  const col = idx % VG.cols;
  el.dataset.idx = idx;
  el.style.left = (col * (VG.tileW + GAP)) + 'px';
  el.style.top = (row * (VG.tileH + GAP)) + 'px';
  el.style.width = VG.tileW + 'px';
  el.style.height = VG.tileH + 'px';

  const img = el.firstElementChild;
  const num = el.lastElementChild;
  num.textContent = 'No.' + p3(item.num);
  el.classList.remove('loaded');
  el.classList.remove('error');
  img.onload = () => { el.classList.add('loaded'); img.onload = null; };
  const myIdx = String(idx);
  fileUrl(item).then(u => {
    if (el.dataset.idx !== myIdx || !el.isConnected) return;   // 瓦片已被复用/回收
    img.src = u;
    if (img.complete && img.naturalWidth) { el.classList.add('loaded'); img.onload = null; }
  }).catch(() => {
    if (el.dataset.idx === myIdx) el.classList.add('error');
  });
}

function updateVirtual() {
  const grid = document.getElementById('grid');
  const total = CURRENT_LIST.length;
  const rows = Math.ceil(total / VG.cols);
  const contentH = rows ? rows * (VG.tileH + GAP) - GAP : 0;
  grid.style.height = contentH + 'px';

  const viewTop = window.scrollY - VG.gridTop;
  const viewBottom = viewTop + window.innerHeight;
  const rowPx = VG.tileH + GAP;
  const first = Math.max(0, Math.floor(viewTop / rowPx) - OVERSCAN_ROWS);
  const last = Math.min(rows - 1, Math.ceil(viewBottom / rowPx) + OVERSCAN_ROWS);

  const wanted = new Set();
  for (let r = first; r <= last; r++) {
    for (let c = 0; c < VG.cols; c++) {
      const i = r * VG.cols + c;
      if (i < total) wanted.add(i);
    }
  }

  // 回收不可见瓦片
  for (const [idx, el] of VG.live) {
    if (!wanted.has(idx)) {
      el.remove();
      VG.live.delete(idx);
      if (VG.pool.length < 80) VG.pool.push(el);
    }
  }
  // 挂载新可见瓦片（优先复用池里的元素）
  for (const idx of wanted) {
    if (VG.live.has(idx)) continue;
    const el = VG.pool.pop() || makeTile();
    fillTile(el, idx);
    grid.appendChild(el);
    VG.live.set(idx, el);
  }
}

function clearGrid() {
  for (const [, el] of VG.live) {
    el.remove();
    if (VG.pool.length < 80) VG.pool.push(el);
  }
  VG.live.clear();
}

function renderGrid(list, keep = false) {
  CURRENT_LIST = list;
  LB_IMAGES = list;

  const infoEl = document.getElementById('grid-info');
  infoEl.style.display = 'flex';
  document.getElementById('grid-count').textContent = list.length;
  const disp = list.filter(f => f.num > 0);
  document.getElementById('grid-range').textContent = disp.length
    ? `No.${p3(disp[0].num)} - No.${p3(disp[disp.length - 1].num)}` : '';

  if (!keep) clearGrid();
  computeLayout();
  updateVirtual();
  // 首帧后再校准一次（此时布局已稳定）
  requestAnimationFrame(() => { computeLayout(); updateVirtual(); });
}

// 点击瓦片 → 打开放大层（事件委托，瓦片可复用）
document.getElementById('grid').addEventListener('click', (e) => {
  const tile = e.target.closest('.thumb');
  if (!tile || tile.dataset.idx === undefined) return;
  openLightbox(parseInt(tile.dataset.idx, 10));
});

window.addEventListener('scroll', () => {
  if (gridScrollScheduled) return;
  gridScrollScheduled = true;
  requestAnimationFrame(() => { gridScrollScheduled = false; updateVirtual(); checkAndLoadMore(); });
}, { passive: true });

window.addEventListener('resize', () => {
  if (!CURRENT_LIST.length) return;
  computeLayout();
  updateVirtual();
});

// ===== Lightbox =====
let LB_NATURAL_W = 0, LB_NATURAL_H = 0;
let LB_FIT_SCALE = 1;
let LB_TX = 0, LB_TY = 0;
let LB_ANIMATING = false;
// 每轮翻页自增一次；旧轮次的定时器/回调凭 token 自动作废，杜绝竞态
let LB_SLIDE_TOKEN = 0;
let LB_SAFETY_TIMER = null;

let DRAG = { active:false, startX:0, startY:0, origX:0, origY:0, moved:false };

const $CUR = () => document.getElementById('lb-current');
const $NXT = () => document.getElementById('lb-next');
const $IMG = () => document.getElementById('lb-img');

function openLightbox(idx) {
  if (!LB_IMAGES.length) return;
  LB_IDX = Math.max(0, Math.min(idx, LB_IMAGES.length - 1));
  LB_SCALE = 1; LB_ROTATE = 0; LB_TX = 0; LB_TY = 0;
  LB_ANIMATING = false;
  LB_SLIDE_TOKEN++;                    // 作废所有在途的翻页回调
  if (LB_SAFETY_TIMER) { clearTimeout(LB_SAFETY_TIMER); LB_SAFETY_TIMER = null; }
  document.getElementById('lightbox').classList.add('show');
  const curBox = $CUR(), nxtBox = $NXT();
  nxtBox.style.display = 'none';
  nxtBox.style.transition = 'none';
  nxtBox.style.transform = '';
  curBox.style.transition = 'none';
  curBox.style.transform = '';
  const img = $IMG();
  img.style.transform = '';
  img.onload = () => {
    LB_NATURAL_W = img.naturalWidth;
    LB_NATURAL_H = img.naturalHeight;
    fitToWindow();
    updateNavDisabled();
  };
  const item = LB_IMAGES[LB_IDX];
  const myIdx = LB_IDX;
  document.getElementById('lb-info').textContent =
    `No.${p3(item.num)} (${myIdx+1}/${LB_IMAGES.length}) · 加载中…`;
  fileUrl(item).then(u => {
    if (LB_IDX !== myIdx) return;      // 已切到别的图
    img.src = u;
  }).catch(() => {
    if (LB_IDX === myIdx) document.getElementById('lb-info').textContent = '图片加载失败';
  });
  prefetchAround(myIdx);
}

// 后台预取相邻几张，翻页即点即有
function prefetchAround(i) {
  for (const d of [-3, -2, -1, 1, 2, 3]) {
    const j = i + d;
    if (j >= 0 && j < LB_IMAGES.length) fileUrl(LB_IMAGES[j]).catch(() => {});
  }
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  const img = $IMG();
  img.onload = null; img.src = '';
}

function fitToWindow() {
  const vw = window.innerWidth * 0.9;
  const vh = window.innerHeight * 0.85;
  LB_FIT_SCALE = LB_NATURAL_W
    ? Math.min(vw / LB_NATURAL_W, vh / LB_NATURAL_H, 1) : 1;
  LB_SCALE = LB_FIT_SCALE; LB_TX = 0; LB_TY = 0;
  updateLB();
}

function toggleZoom() {
  if (LB_ANIMATING) return;
  if (Math.abs(LB_SCALE - LB_FIT_SCALE) < 0.01) {
    LB_SCALE = Math.max(LB_FIT_SCALE * 2, 1);
  } else { LB_SCALE = LB_FIT_SCALE; }
  LB_TX = 0; LB_TY = 0; updateLB();
}

function updateLB() {
  const img = $IMG();
  const cur = LB_IMAGES[LB_IDX];
  img.style.transform = 'rotate(' + LB_ROTATE + 'deg) scale(' + (LB_SCALE / LB_FIT_SCALE) + ')';
  $CUR().style.transform = 'translate(' + LB_TX + 'px, ' + LB_TY + 'px)';
  img.style.cursor = (Math.abs(LB_SCALE - LB_FIT_SCALE) < 0.01) ? 'zoom-in' : 'grab';
  document.getElementById('lb-info').textContent =
    'No.' + p3(cur.num) + ' (' + (LB_IDX+1) + '/' + LB_IMAGES.length + ') · ' + (LB_SCALE*100).toFixed(0) + '%';
}

function lbPrev() { if (LB_IDX > 0 && !LB_ANIMATING) slideTo(LB_IDX - 1); }
function lbNext() { if (LB_IDX < LB_IMAGES.length - 1 && !LB_ANIMATING) slideTo(LB_IDX + 1); }

// 同时滑出+滑入；方向由索引差决定，不依赖外部传参
function slideTo(newIdx) {
  if (LB_ANIMATING || newIdx < 0 || newIdx >= LB_IMAGES.length) return;
  LB_ANIMATING = true;
  if (LB_SAFETY_TIMER) { clearTimeout(LB_SAFETY_TIMER); LB_SAFETY_TIMER = null; }

  const token = ++LB_SLIDE_TOKEN;      // 本轮令牌：旧轮一切回调凭它作废
  const curBox = $CUR();
  const nxtBox = $NXT();
  const nxtImg = document.getElementById('lb-img2');

  // 向后翻页(→)：新图从右侧来、旧图向左出
  // 向前翻页(←)：新图从左侧来、旧图向右出
  const forward = newIdx > LB_IDX;
  const startX = forward ? '100vw' : '-100vw';
  const endX   = forward ? '-100vw' : '100vw';

  // 1) 无过渡地锁定初始状态（按需模式：先取到图再开演动画）
  fileUrl(LB_IMAGES[newIdx]).then(u => {
    if (token !== LB_SLIDE_TOKEN) return;          // 期间已发起更新的翻页
    curBox.style.transition = 'none';
    nxtBox.style.transition = 'none';
    curBox.style.transform = 'translateX(0)';
    nxtBox.style.display = 'flex';
    nxtBox.style.transform = 'translateX(' + startX + ')';
    nxtImg.style.transform = '';
    nxtImg.src = u;

    // 2) 双 rAF 确保首帧已上屏，再启动过渡（比强制 reflow 更稳）
    requestAnimationFrame(() => requestAnimationFrame(() => {
    if (token !== LB_SLIDE_TOKEN) return;
    const ease = 'transform 250ms ease';
    curBox.style.transition = ease;
    nxtBox.style.transition = ease;
    curBox.style.transform = 'translateX(' + endX + ')';
    nxtBox.style.transform = 'translateX(0)';

    // 3) 过渡结束后交换身份
    setTimeout(() => {
      if (token !== LB_SLIDE_TOKEN) return;
      LB_IDX = newIdx;
      const newSrc = nxtImg.src;

      const img = $IMG();
      const finish = () => {
        if (token !== LB_SLIDE_TOKEN) return;   // 旧轮不得干扰新轮
        LB_NATURAL_W = img.naturalWidth;
        LB_NATURAL_H = img.naturalHeight;
        fitToWindow();
        updateNavDisabled();
        LB_ANIMATING = false;
        if (LB_SAFETY_TIMER) { clearTimeout(LB_SAFETY_TIMER); LB_SAFETY_TIMER = null; }
      };
      img.onload = finish;
      img.style.transform = '';
      img.src = newSrc;

      // 无过渡复位，隐藏替身
      nxtImg.src = '';
      nxtBox.style.transition = 'none';
      nxtBox.style.display = 'none';
      nxtBox.style.transform = '';
      curBox.style.transition = 'none';
      curBox.style.transform = '';
      LB_SCALE = 1; LB_ROTATE = 0; LB_TX = 0; LB_TY = 0;

      // 兜底解锁（仅对本轮有效）
      LB_SAFETY_TIMER = setTimeout(finish, 600);
    }, 270);
    }));
  }).catch(() => {
    if (token === LB_SLIDE_TOKEN) {
      LB_ANIMATING = false;
      toast('图片加载失败', true);
    }
  });
}

// 首/末张禁用对应箭头
function updateNavDisabled() {
  const prev = document.querySelector('.lb-prev');
  const next = document.querySelector('.lb-next');
  if (prev) prev.style.opacity = (LB_IDX <= 0) ? '0.3' : '1';
  if (next) next.style.opacity = (LB_IDX >= LB_IMAGES.length - 1) ? '0.3' : '1';
}

// 缩放：默认以视口中心为锚点；传入 clientX/clientY 时以光标为锚点
function lbZoom(delta, clientX, clientY) {
  if (LB_ANIMATING) return;             // 翻页动画期间不打断位移动画
  const base = LB_FIT_SCALE;
  const oldScale = LB_SCALE;
  const newScale = Math.max(base * 0.3, Math.min(base * 8, oldScale * (1 + delta)));
  const r = newScale / oldScale;
  // 锚点相对视口中心的偏移（默认 0 = 视口中心）
  const px = (clientX === undefined) ? 0 : clientX - window.innerWidth / 2;
  const py = (clientY === undefined) ? 0 : clientY - window.innerHeight / 2;
  // 让锚点下的图像坐标在新缩放后仍停留在同一屏幕位置
  LB_TX = px - r * (px - LB_TX);
  LB_TY = py - r * (py - LB_TY);
  LB_SCALE = newScale;
  updateLB();
}
function lbZoomReset() { if (LB_ANIMATING) return; LB_ROTATE = 0; fitToWindow(); }
function lbRotate(deg) { if (LB_ANIMATING) return; LB_ROTATE += deg; updateLB(); }

// ===== 拖动 =====
document.getElementById('lb-img').addEventListener('mousedown', (e) => {
  if (LB_ANIMATING) return;
  if (Math.abs(LB_SCALE - LB_FIT_SCALE) < 0.01) return;
  e.preventDefault();
  DRAG.active = true; DRAG.moved = false;
  DRAG.startX = e.clientX; DRAG.startY = e.clientY;
  DRAG.origX = LB_TX; DRAG.origY = LB_TY;
  $IMG().style.cursor = 'grabbing';
});

document.addEventListener('mousemove', (e) => {
  if (!DRAG.active) return;
  const dx = e.clientX - DRAG.startX;
  const dy = e.clientY - DRAG.startY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) DRAG.moved = true;
  LB_TX = DRAG.origX + dx;
  LB_TY = DRAG.origY + dy;
  $CUR().style.transform = 'translate(' + LB_TX + 'px, ' + LB_TY + 'px)';
});

document.addEventListener('mouseup', () => {
  if (!DRAG.active) return;
  DRAG.active = false;
  $IMG().style.cursor =
    (Math.abs(LB_SCALE - LB_FIT_SCALE) < 0.01) ? 'zoom-in' : 'grab';
});

// ===== 事件绑定 =====
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('show')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lbPrev();
  else if (e.key === 'ArrowRight') lbNext();
  else if (e.key === '+' || e.key === '=') lbZoom(0.1);
  else if (e.key === '-') lbZoom(-0.1);
  else if (e.key === 'r' || e.key === 'R') lbRotate(90);
  else if (e.key === 'l' || e.key === 'L') lbRotate(-90);
});

// 滚轮缩放（以光标为锚点，上滚放大、下滚缩小）
document.getElementById('lb-img').addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.12 : 0.12;
  lbZoom(delta, e.clientX, e.clientY);
}, { passive: false });

// 点击 lightbox 背景关闭
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') closeLightbox();
});
// 点击图片切换缩放（拖动后不触发）
document.getElementById('lb-img').addEventListener('click', (e) => {
  e.stopPropagation();
  if (DRAG.moved) { DRAG.moved = false; return; }
  toggleZoom();
});

// 下载并查看：当前下拉框选中的编号段
document.getElementById('dl-btn').addEventListener('click', async () => {
  if (!INDEX) return;
  const sel = document.getElementById('zip-select');
  const zipInfo = INDEX.zips.find(z => z.zip_name === sel.value);
  if (!zipInfo) return;
  CURRENT_ZIP = zipInfo;

  if (ZIP_CACHE.has(zipInfo.zip_name)) {      // 已缓存：直接展示
    const e = ZIP_CACHE.get(zipInfo.zip_name);
    ZIP_CACHE.delete(zipInfo.zip_name); ZIP_CACHE.set(zipInfo.zip_name, e);
    renderGrid(e.files);
    toast(`✅ 已加载 ${e.files.length} 张（${zipInfo.label} · 缓存）`);
    return;
  }
  await loadSelection([zipInfo], null, zipInfo.label);
});

document.getElementById('zip-select').addEventListener('change', (e) => {
  const zipInfo = INDEX.zips.find(z => z.zip_name === e.target.value);
  if (zipInfo) CURRENT_ZIP = zipInfo;
});

document.getElementById('jump-btn').addEventListener('click', jumpToNumber);
document.getElementById('range-btn').addEventListener('click', browseRange);
document.getElementById('month-btn').addEventListener('click', viewMonth);
document.getElementById('jump-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') jumpToNumber();
});

// 打开一张已加载列表里的图；编号不存在时定位到最近一张
function openNearest(list, val) {
  if (!list || !list.length) return;
  let idx = list.findIndex(f => f.num === val);
  if (idx < 0) {
    idx = list.findIndex(f => f.num > val);
    if (idx < 0) idx = list.length - 1;
    toast(`No.${p3(val)} 不存在，已定位到最近的 No.${p3(list[idx].num)}`);
  }
  openLightbox(idx);
}

// 编号直达：单个编号 → 找到所在包 → 打开对应图片
async function jumpToNumber() {
  if (!INDEX) return;
  const raw = document.getElementById('jump-input').value.trim();
  const m = raw.match(/^(\d+)/);
  if (!m) return toast('请输入编号，如 7800', true);
  const val = parseInt(m[1], 10);

  if (INDEX.range_min != null && (val < INDEX.range_min || val > INDEX.range_max)) {
    return toast(`No.${p3(val)} 超出收录范围（No.${p3(INDEX.range_min)}–${p3(INDEX.range_max)}）`, true);
  }

  // 已在当前列表 → 直接打开
  const inCur = CURRENT_LIST.findIndex(f => f.num === val);
  if (inCur >= 0) return openLightbox(inCur);

  const owner = INDEX.zips.find(z => z.range && val >= z.range[0] && val <= z.range[1]);
  if (owner) {
    if (!ZIP_CACHE.has(owner.zip_name)) toast(`No.${p3(val)} 在 ${owner.label}，开始下载...`);
    const list = await loadSelection([owner], null, owner.label, false);
    if (list) openNearest(list, val);
    return;
  }

  // 落在两个包之间的空档：跳到下一个包的第一张
  const next = INDEX.zips
    .filter(z => z.range && z.range[0] > val)
    .sort((a, b) => a.range[0] - b.range[0])[0];
  if (!next) return toast(`No.${p3(val)} 未收录`, true);
  toast(`No.${p3(val)} 未收录，已跳到最近的 No.${p3(next.range[0])}`);
  const list = await loadSelection([next], null, next.label, false);
  if (list) openNearest(list, next.range[0]);
}

// 范围浏览：编号段 → 自动串联覆盖范围内的所有包 → 只列出命中的图片
async function browseRange() {
  if (!INDEX) return;
  const raw = document.getElementById('jump-input').value.trim();
  let lo, hi;
  const m = raw.match(/^(\d+)\s*[-~～—–]\s*(\d+)$/);
  if (m) { lo = parseInt(m[1], 10); hi = parseInt(m[2], 10); if (lo > hi) [lo, hi] = [hi, lo]; }
  else if (/^\d+$/.test(raw)) { return jumpToNumber(); }
  else return toast('格式：7800 或 7600-7700', true);

  if (hi - lo > 3000) return toast('范围过大（跨度过 3000 编号），请缩小后重试', true);

  const covering = INDEX.zips.filter(z => z.range && z.range[1] >= lo && z.range[0] <= hi);
  if (!covering.length) return toast(`No.${p3(lo)}–${p3(hi)} 均未收录`, true);

  const estMB = covering.reduce((s, z) => s + (z.size_mb || 0), 0);
  if (!REMOTE_OK && estMB > 900 && !window.confirm(
    `No.${p3(lo)}–${p3(hi)} 需要下载 ${covering.length} 个包，合计约 ${Math.round(estMB)} MB。继续？`
  )) return;

  document.getElementById('zip-select').value = covering[0].zip_name;
  syncZipCascade();
  CURRENT_ZIP = covering[0];
  await loadSelection(covering, [[lo, hi]], `范围 No.${p3(lo)}–${p3(hi)}`);
}

// 启动
loadIndex();
</script>
