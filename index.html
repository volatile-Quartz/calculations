<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>草稿纸查看器</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f6f8fa; color: #1f2328; }
  header { background: #fff; border-bottom: 1px solid #d0d7de; padding: 14px 24px;
           position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .header-row { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.15em; white-space: nowrap; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input, button { padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 6px;
                          font-size: 13px; background: #fff; font-family: inherit; }
  button { background: #0969da; color: #fff; cursor: pointer; border-color: #0969da; }
  button:hover { background: #0550ae; }
  button:disabled { background: #9198a1; border-color: #9198a1; cursor: not-allowed; }
  input[type="number"] { width: 85px; }
  .stat { color: #57606a; font-size: 12px; white-space: nowrap; }

  main { max-width: 1200px; margin: 20px auto; padding: 0 24px; }

  .download-bar { background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
                  padding: 14px; margin-bottom: 16px; display: flex; align-items: center;
                  gap: 14px; flex-wrap: wrap; }
  .download-info { flex: 1; }
  .progress-wrap { flex: 0 0 200px; height: 8px; background: #eaeef2; border-radius: 4px; overflow: hidden; }
  .progress-bar { height: 100%; background: #0969da; width: 0%; transition: width .2s; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
             gap: 10px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
          overflow: hidden; cursor: zoom-in; transition: transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fafbfc; }
  .card .no { padding: 4px; font-size: 12px; font-weight: 600; text-align: center;
              border-top: 1px solid #d0d7de; background: #f6f8fa; }

  .status-msg { background: #fff8c5; border: 1px solid #d4a72c; border-radius: 6px;
                padding: 12px 16px; margin-bottom: 12px; font-size: 13px; }
  .status-ok { background: #dafbe1; border-color: #2da44e; }
  .status-err { background: #ffebe9; border-color: #cf222e; }

  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
             z-index: 200; align-items: center; justify-content: center; cursor: zoom-out; }
  #overlay.active { display: flex; }
  #viewer-img { max-width: 92vw; max-height: 92vh; object-fit: contain; }
  .viewer-nav { position: absolute; top: 50%; transform: translateY(-50%);
                background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 26px;
                padding: 20px; cursor: pointer; border-radius: 50%; }
  .viewer-nav:hover { background: rgba(255,255,255,.3); }
  .viewer-prev { left: 20px; }
  .viewer-next { right: 20px; }
  .viewer-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
                 color: #fff; background: rgba(0,0,0,.6); padding: 5px 12px; border-radius: 14px; font-size: 12px; }
  .viewer-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,.15);
                  border: none; color: #fff; font-size: 18px; padding: 6px 12px;
                  cursor: pointer; border-radius: 50%; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>📐 草稿纸查看器</h1>
    <div class="controls">
      <select id="zip-select" disabled><option value="">加载索引...</option></select>
      <span class="stat" id="zip-info"></span>
      <input type="number" id="goto-input" placeholder="编号" disabled>
      <button id="goto-btn" disabled>跳转</button>
    </div>
  </div>
</header>

<main>
  <div id="status" class="status-msg">正在加载索引...</div>

  <div class="download-bar" id="download-bar" style="display:none">
    <div class="download-info">
      <strong id="dl-filename"></strong>
      <span id="dl-detail" class="stat"></span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="dl-progress"></div></div>
    <button id="dl-cancel" style="background:#cf222e;border-color:#cf222e">取消</button>
  </div>

  <div class="gallery" id="gallery"></div>
</main>

<div id="overlay">
  <button class="viewer-close">✕</button>
  <button class="viewer-nav viewer-prev">‹</button>
  <img id="viewer-img" alt="">
  <button class="viewer-nav viewer-next">›</button>
  <div class="viewer-info" id="viewer-info"></div>
</div>

<script>
// ===== 配置 =====
// 生产环境请改成你的 Cloudflare Worker URL
const WORKER_URL = 'https://calculations-viewer.502487460.workers.dev';

let INDEX = null;
let currentZip = null;   // 当前选中的 zip 信息
let currentImages = []; // [{no, name, blobUrl}, ...]
let viewerIdx = 0;
let abortCtrl = null;

// ===== 加载索引 =====
async function loadIndex() {
  showStatus('正在加载索引...', '');
  try {
    const r = await fetch('index.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    INDEX = await r.json();

    const sel = document.getElementById('zip-select');
    sel.innerHTML = '';
    for (const z of INDEX.zips) {
      const opt = document.createElement('option');
      opt.value = z.zip_name;
      opt.textContent = `${z.label} · ${z.size_mb} MB · No.${z.range[0]}–${z.range[1]} (${z.count}张)`;
      sel.appendChild(opt);
    }
    sel.disabled = false;
    document.getElementById('goto-input').disabled = false;
    document.getElementById('goto-btn').disabled = false;

    if (INDEX.zips.length > 0) {
      // 默认选最新（sync_index 已按 zip_name 倒序排）
      sel.value = INDEX.zips[0].zip_name;
      onZipChange();
    }
    showStatus(`✅ 索引就绪：${INDEX.zips.length} 个 zip / 约 ${INDEX.zips.reduce((s,z)=>s+z.count,0)} 张图片`, 'status-ok');
  } catch (e) {
    showStatus('❌ 索引加载失败：' + e.message + '<br><small>请先在 GitHub 发 Release 并运行 sync_index workflow</small>', 'status-err');
  }
}

function showStatus(msg, cls) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = 'status-msg ' + (cls || '');
}

function onZipChange() {
  const zipName = document.getElementById('zip-select').value;
  if (!zipName) return;
  currentZip = INDEX.zips.find(z => z.zip_name === zipName);
  document.getElementById('zip-info').textContent =
    `${currentZip.label} · ${currentZip.size_mb} MB · No.${currentZip.range[0]}–${currentZip.range[1]}`;
  // 旧图片释放内存
  for (const img of currentImages) URL.revokeObjectURL(img.blobUrl);
  currentImages = [];
  document.getElementById('gallery').innerHTML = '';
  document.getElementById('gallery').innerHTML =
    `<div class="status-msg" style="text-align:center">
      👉 点击下方<b>下载并查看</b>按钮加载 ${currentZip.zip_name}（${currentZip.size_mb} MB）
      <button id="dl-trigger" style="margin-left:12px">📥 下载并查看</button>
     </div>`;
  document.getElementById('dl-trigger').onclick = () => downloadAndShow();
}

// ===== Worker URL 解析 =====
function getZipUrl(zipInfo) {
  if (WORKER_URL) {
    // Worker 路由：/zip/{owner}/{repo}/{asset_id}
    return `${WORKER_URL}/zip/${INDEX.repo}/${zipInfo.asset_id}`;
  }
  return zipInfo.browser_url || '';
}

// ===== 下载 zip + 解压 =====
async function downloadAndShow() {
  if (!currentZip) return;
  const zipUrl = getZipUrl(currentZip);

  document.getElementById('download-bar').style.display = 'flex';
  document.getElementById('dl-filename').textContent = currentZip.zip_name;
  document.getElementById('dl-detail').textContent = `下载 ${currentZip.size_mb} MB`;
  document.getElementById('dl-progress').style.width = '0%';

  abortCtrl = new AbortController();
  document.getElementById('dl-cancel').onclick = () => abortCtrl.abort();

  try {
    const resp = await fetch(zipUrl, { signal: abortCtrl.signal });
    if (!resp.ok) throw new Error('HTTP ' + resp.status + '（可能 CORS 被拦，请配置 Worker）');

    const total = Number(resp.headers.get('content-length') || currentZip.size_mb * 1024 * 1024);
    const reader = resp.body.getReader();
    const chunks = []; let received = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      const pct = total ? (received / total * 100).toFixed(0) : ((received / 1024 / 1024).toFixed(0) + ' MB');
      document.getElementById('dl-progress').style.width = (total ? pct + '%' : Math.min(100, parseInt(pct)) + '%');
      document.getElementById('dl-detail').textContent =
        `${(received/1024/1024).toFixed(1)} / ${currentZip.size_mb} MB`;
    }

    const blob = new Blob(chunks, { type: 'application/zip' });
    document.getElementById('dl-detail').textContent = '解压中...';

    const zip = await JSZip.loadAsync(blob);
    // 按编号排序，只保留图片
    const files = Object.values(zip.files)
      .filter(f => !f.dir && /\.(png|jpe?g|gif|webp)$/i.test(f.name))
      .sort((a, b) => {
        const an = parseInt(a.name.match(/(\d+)/)[1]);
        const bn = parseInt(b.name.match(/(\d+)/)[1]);
        return an - bn;
      });

    currentImages = [];
    for (const f of files) {
      const arr = await f.async('arraybuffer');
      const blobUrl = URL.createObjectURL(new Blob([arr], { type: 'image/jpeg' }));
      const no = parseInt(f.name.match(/(\d+)/)[1]);
      currentImages.push({ no, name: f.name, blobUrl });
    }

    renderGallery();
    document.getElementById('download-bar').style.display = 'none';
  } catch (e) {
    if (e.name === 'AbortError') {
      showStatus('已取消下载', '');
      document.getElementById('download-bar').style.display = 'none';
    } else {
      showStatus('❌ 下载失败：' + e.message, 'status-err');
      document.getElementById('download-bar').style.display = 'none';
    }
  }
}

function renderGallery() {
  const grid = document.getElementById('gallery');
  grid.innerHTML = '';
  for (const img of currentImages) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<img src="${img.blobUrl}" loading="lazy"><div class="no">No.${img.no}</div>`;
    card.onclick = () => openViewer(currentImages.indexOf(img));
    grid.appendChild(card);
  }
  showStatus(`✅ ${currentZip.label} 加载完成 · ${currentImages.length} 张图片`, 'status-ok');
}

// ===== 编号跳转 =====
function gotoNumber() {
  const no = parseInt(document.getElementById('goto-input').value);
  if (!no || !INDEX) return;
  // 找哪个 zip 包含这个编号
  const target = INDEX.zips.find(z => no >= z.range[0] && no <= z.range[1]);
  if (!target) { showStatus(`⚠️ No.${no} 不在任何已发布 zip 中`, ''); return; }
  document.getElementById('zip-select').value = target.zip_name;
  onZipChange();
  // 等用户点下载，或者自动下载（当前 zip 已有数据则直接定位）
  setTimeout(() => {
    if (currentImages.length > 0) {
      const idx = currentImages.findIndex(i => i.no === no);
      if (idx >= 0) openViewer(idx);
      else showStatus(`⚠️ No.${no} 不在当前已加载的数据中（可能不在这个 zip 里）`, '');
    } else {
      document.getElementById('dl-trigger')?.click();
      document.getElementById('status').innerHTML += `<br><small>编号 No.${no} 属于 ${target.label}，下载完成后将自动定位</small>`;
    }
  }, 100);
}

// ===== 放大查看 =====
function openViewer(idx) {
  viewerIdx = idx;
  const img = currentImages[idx];
  document.getElementById('viewer-img').src = img.blobUrl;
  document.getElementById('viewer-info').textContent =
    `No.${img.no} · ${idx + 1}/${currentImages.length}`;
  document.getElementById('overlay').classList.add('active');
}
function closeViewer() { document.getElementById('overlay').classList.remove('active'); }
function viewerPrev() { if (viewerIdx > 0) openViewer(viewerIdx - 1); }
function viewerNext() { if (viewerIdx < currentImages.length - 1) openViewer(viewerIdx + 1); }

// ===== 键盘 =====
document.addEventListener('keydown', e => {
  if (document.getElementById('overlay').classList.contains('active')) {
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') viewerPrev();
    else if (e.key === 'ArrowRight') viewerNext();
  } else if (e.key === 'Enter' && document.activeElement.tagName === 'INPUT') {
    gotoNumber();
  }
});

// ===== 事件 =====
document.getElementById('zip-select').addEventListener('change', onZipChange);
document.getElementById('goto-btn').addEventListener('click', gotoNumber);
document.getElementById('goto-input').addEventListener('keydown', e => { if (e.key === 'Enter') gotoNumber(); });
document.querySelector('.viewer-close').addEventListener('click', closeViewer);
document.querySelector('.viewer-prev').addEventListener('click', viewerPrev);
document.querySelector('.viewer-next').addEventListener('click', viewerNext);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeViewer();
});

loadIndex();
</script>
